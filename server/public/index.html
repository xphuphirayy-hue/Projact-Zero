<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Zero : Get Key</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(45deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .task-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .task-item.completed {
            background: rgba(0, 255, 0, 0.05);
            border-color: rgba(0, 255, 0, 0.3);
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .task-checkbox.checked {
            background: linear-gradient(45deg, #00d4ff, #7b2ff7);
            border-color: transparent;
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .task-desc {
            font-size: 0.85em;
            color: #888;
        }

        .task-link {
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.85em;
        }

        .task-link:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00d4ff, #7b2ff7);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .result-box {
            display: none;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .result-box.show {
            display: block;
        }

        .key-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 1.2em;
            word-break: break-all;
            margin: 15px 0;
            color: #00d4ff;
        }

        .error-box {
            display: none;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            color: #ff6b6b;
        }

        .error-box.show {
            display: block;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .session-info {
            text-align: center;
            font-size: 0.8em;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Project Zero</h1>
        <p class="subtitle">Complete the tasks below to get your whitelist key</p>

        <ul class="task-list" id="taskList">
            <!-- Tasks will be loaded here -->
        </ul>

        <button class="btn btn-primary" id="completeBtn" disabled>
            Complete All Tasks & Get Key
        </button>

        <div class="spinner" id="spinner"></div>

        <div class="result-box" id="resultBox">
            <h3>Your Key</h3>
            <div class="key-display" id="keyDisplay"></div>
            <button class="btn btn-secondary" onclick="copyKey()">Copy Key</button>
            <p style="margin-top: 10px; font-size: 0.9em; color: #888;">
                Save this key and enter it in the script
            </p>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="session-info" id="sessionInfo"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let sessionId = null;
        let tasks = [];
        let completedTasks = new Set();

        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        sessionId = urlParams.get('session');

        if (!sessionId) {
            showError('Invalid session. Please open this page from the script.');
            document.getElementById('completeBtn').disabled = true;
        }

        // Load tasks
        async function loadTasks() {
            try {
                const response = await fetch(`${API_BASE}/api/getkey/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                const data = await response.json();

                if (!data.success) {
                    showError(data.message || 'Failed to load tasks');
                    return;
                }

                tasks = data.tasks || [];
                renderTasks();

                if (data.status === 'approved' && data.key) {
                    showKey(data.key);
                }
            } catch (err) {
                showError('Network error. Please try again.');
            }
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.id = `task-${index}`;

                li.innerHTML = `
                    <div class="task-checkbox" onclick="toggleTask(${index})"></div>
                    <div class="task-info">
                        <div class="task-title">${task.title}</div>
                        <div class="task-desc">${task.description}</div>
                        <a href="${task.url}" target="_blank" class="task-link">Open Link →</a>
                    </div>
                `;

                taskList.appendChild(li);
            });

            updateCompleteButton();
        }

        function toggleTask(index) {
            const taskItem = document.getElementById(`task-${index}`);
            const checkbox = taskItem.querySelector('.task-checkbox');

            if (completedTasks.has(index)) {
                completedTasks.delete(index);
                checkbox.classList.remove('checked');
                taskItem.classList.remove('completed');
            } else {
                completedTasks.add(index);
                checkbox.classList.add('checked');
                taskItem.classList.add('completed');
            }

            updateCompleteButton();
        }

        function updateCompleteButton() {
            const btn = document.getElementById('completeBtn');
            btn.disabled = completedTasks.size !== tasks.length;
        }

        document.getElementById('completeBtn').addEventListener('click', async () => {
            const btn = document.getElementById('completeBtn');
            const spinner = document.getElementById('spinner');

            btn.disabled = true;
            spinner.style.display = 'block';

            const taskProofs = {};
            completedTasks.forEach(index => {
                taskProofs[tasks[index].type] = true;
            });

            try {
                const response = await fetch(`${API_BASE}/api/getkey/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        task_proofs: taskProofs
                    })
                });

                const data = await response.json();

                if (data.success && data.key) {
                    showKey(data.key);
                } else {
                    showError(data.message || 'Failed to complete work');
                    btn.disabled = false;
                }
            } catch (err) {
                showError('Network error. Please try again.');
                btn.disabled = false;
            }

            spinner.style.display = 'none';
        });

        function showKey(key) {
            document.getElementById('resultBox').classList.add('show');
            document.getElementById('keyDisplay').textContent = key;
            document.getElementById('completeBtn').style.display = 'none';
            document.getElementById('taskList').style.opacity = '0.5';
            document.getElementById('taskList').style.pointerEvents = 'none';
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').textContent;
            navigator.clipboard.writeText(key).then(() => {
                alert('Key copied to clipboard!');
            });
        }

        // Initialize
        document.getElementById('sessionInfo').textContent = `Session: ${sessionId ? sessionId.substring(0, 16) + '...' : 'N/A'}`;
        loadTasks();
    </script>
</body>
</html>
